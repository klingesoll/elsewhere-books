name: Fetch Luma Events

on:
  schedule:
    # 08:00 Melbourne time (UTC+10 AEST / UTC+11 AEDT)
    # Run at 21:00 UTC — lands between 7am–8am Melbourne year-round
    - cron: '0 21 * * *'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch events from Luma
        run: node scripts/fetch-events.js

      - name: Commit updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync Luma events [skip ci]"
          git push
